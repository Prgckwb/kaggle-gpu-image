name: Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Every Monday 00:00 UTC (09:00 JST)
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      # versions.env is the single source of truth for CUDA_VERSION / CUDA_TAG /
      # CUDA_BASE_TAG. Load it into GITHUB_ENV so later steps can use ${{ env.* }}.
      - name: Load versions.env into env
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"

      # Catch drift between versions.env and the literal FROM tag in Dockerfile
      # (FROM stays literal so Dependabot's docker ecosystem can pin its digest).
      - name: Verify Dockerfile FROM matches CUDA_BASE_TAG
        run: |
          if ! grep -qE "^FROM runpod/base:[^ ]*${CUDA_BASE_TAG}-ubuntu" Dockerfile; then
            echo "ERROR: Dockerfile FROM line does not contain '${CUDA_BASE_TAG}-ubuntu'"
            grep '^FROM' Dockerfile
            exit 1
          fi

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=cu${{ env.CUDA_VERSION }}
            type=sha,prefix=cu${{ env.CUDA_VERSION }}-,format=short
            type=sha

      # Build into the local daemon first so we can scan before publishing.
      - name: Build image (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_TAG=${{ env.CUDA_TAG }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report HIGH+CRITICAL findings to the Security tab (SARIF upload below)
      # without blocking the job. Keeps visibility into fixable HIGH CVEs that
      # originate upstream (e.g. Go stdlib in gh) without freezing CI on them.
      - name: Scan image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      # Release gate: fail the job only on fixable CRITICAL vulnerabilities so
      # upstream base-image HIGH churn does not block every push.
      - name: Scan image for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:latest
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Scan passed — publish all tags from the local daemon.
      - name: Push image
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
